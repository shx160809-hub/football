name: Auto Football Prediction

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run pipeline
      run: |
        python pipeline.py train
        python pipeline.py backtest
        python pipeline.py predict --matches-json data/output/sample_matches.json

    - name: Commit and push reports
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update prediction reports: $(date +'%Y-%m-%d')" && git push)
